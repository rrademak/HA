blueprint:
  name: Battery Management (smart discharge)
  description: >-
    Dynamically adjust battery discharge based on grid import/export,
    remaining solar production and battery SOC.
  domain: automation

  input:
    net_power:
      name: Meter - Netto power (W)
      selector:
        entity:
          domain: sensor

    production_remaining:
      name: PV Forecast - Remaining production today (kWh)
      selector:
        entity:
          domain: sensor

    night_threshold:
      name: PV Forecast - Threshold for night mode (kWh)
      default: 0.25
      selector:
        number:
          min: 0
          max: 5
          step: 0.05
          unit_of_measurement: kWh
          mode: slider

    battery_soc:
      name: Battery - Current SOC
      selector:
        entity:
          domain: sensor

    ac_output_limit:
      name: Battery - AC output limit
      selector:
        entity:
          domain: number

    import_threshold:
      name: Import threshold for allowing discharge (W)
      default: 500
      selector:
        number:
          min: 0
          max: 3000
          step: 100
          unit_of_measurement: W
          mode: slider

    export_threshold:
      name: Export threshold for disallowing discharge (W)
      default: 0
      selector:
        number:
          min: -1000
          max: 0
          step: 50
          unit_of_measurement: W
          mode: slider

    minimum_soc:
      name: Minimum SOC for daytime discharge (%)
      default: 75
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    discharge_power:
      name: Discharge power when importing (W)
      default: 800
      selector:
        number:
          min: 0
          max: 2400
          step: 100
          unit_of_measurement: W
          mode: slider

triggers:
  - trigger: numeric_state
    entity_id: !input net_power
    above: !input import_threshold
    for: "00:01:00"
    id: import

  - trigger: numeric_state
    entity_id: !input net_power
    below: !input export_threshold
    for: "00:01:00"
    id: export

conditions: []

actions:
  - variables:
      ac_limit_entity: !input ac_output_limit
      forecast_entity: !input production_remaining
      soc_entity: !input battery_soc
      current_limit: "{{ states(ac_limit_entity) | float(0) }}"
      max_power: !input discharge_power
      production_remaining_value: "{{ states(forecast_entity) | float(0) }}"
      battery_soc_value: "{{ states(soc_entity) | float(0) }}"
      forecast_threshold: !input night_threshold
      minimum_soc_value: !input minimum_soc

  - choose:
      - conditions:
          - condition: trigger
            id: import
          - condition: template
            value_template: "{{ current_limit != max_power }}"
          - condition: or
            conditions:
              - condition: template
                value_template: >
                  {{ production_remaining_value < forecast_threshold }}
              - condition: and
                conditions:
                  - condition: template
                    value_template: >
                      {{ production_remaining_value > forecast_threshold }}
                  - condition: template
                    value_template: >
                      {{ battery_soc_value > minimum_soc_value }}
        sequence:
          - action: number.set_value
            target:
              entity_id: !input ac_output_limit
            data:
              value: !input discharge_power

      - conditions:
          - condition: trigger
            id: export
          - condition: template
            value_template: "{{ current_limit != 0 }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: !input ac_output_limit
            data:
              value: 0

mode: single

blueprint:
  name: Tuya Remote _TZ3000_rco1yzb1 (ZHA)
  description: Map ZHA events for Tuya remote _TZ3000_rco1yzb1 to actions.
  domain: automation

  input:
    device:
      name: ZHA Device
      description: Select your _TZ3000_rco1yzb1 device
      selector:
        device:
          integration: zha

    event_1:
      name: Event 1
      default: ""
      selector:
        text: {}
    action_1:
      name: Action 1
      default: []
      selector:
        action: {}

    event_2:
      name: Event 2
      default: ""
      selector:
        text: {}
    action_2:
      name: Action 2
      default: []
      selector:
        action: {}

    event_3:
      name: Event 3
      default: ""
      selector:
        text: {}
    action_3:
      name: Action 3
      default: []
      selector:
        action: {}

    event_4:
      name: Event 4
      default: ""
      selector:
        text: {}
    action_4:
      name: Action 4
      default: []
      selector:
        action: {}

    event_5:
      name: Event 5
      default: ""
      selector:
        text: {}
    action_5:
      name: Action 5
      default: []
      selector:
        action: {}

    event_6:
      name: Event 6
      default: ""
      selector:
        text: {}
    action_6:
      name: Action 6
      default: []
      selector:
        action: {}

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input device

variables:
  ev1: !input event_1
  ev2: !input event_2
  ev3: !input event_3
  ev4: !input event_4
  ev5: !input event_5
  ev6: !input event_6

  event_value: >
    {{ trigger.event.data.command
       if trigger.event.data.command is defined
       else (trigger.event.data.args[0] if trigger.event.data.args|length > 0 else "") }}

action:
  - choose:
      - conditions: "{{ ev1 != '' and event_value == ev1 }}"
        sequence: !input action_1

      - conditions: "{{ ev2 != '' and event_value == ev2 }}"
        sequence: !input action_2

      - conditions: "{{ ev3 != '' and event_value == ev3 }}"
        sequence: !input action_3

      - conditions: "{{ ev4 != '' and event_value == ev4 }}"
        sequence: !input action_4

      - conditions: "{{ ev5 != '' and event_value == ev5 }}"
        sequence: !input action_5

      - conditions: "{{ ev6 != '' and event_value == ev6 }}"
        sequence: !input action_6
